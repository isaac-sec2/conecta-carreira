services:
  - type: web
    name: conecta-carreira
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --worker-class gthread --threads 12 --workers 1 --timeout 150
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: ALLOWED_ORIGINS
        value: ""
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: MAX_STREAMS
        value: "8"
